  <line x1="835" y1="570" x2="1039.6" y2="467.7" marker-end="url(#arrowhead-ov)" stroke="#dc3545" stroke-width="1.2" fill="none" stroke-dasharray="6,3"/>
  <text x="916.9" y="512.1" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#dc3545" font-family="Helvetica,Arial,sans-serif">the better X predicts survival,</text>
  <text x="916.9" y="525.1" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#dc3545" font-family="Helvetica,Arial,sans-serif">the smaller the ambiguous</text>
  <text x="916.9" y="538.1" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#dc3545" font-family="Helvetica,Arial,sans-serif">share of survivors</text>
  <!-- nodes -->
  <rect x="40" y="110" width="190" height="56" rx="12.3" fill="#cfe2ff" stroke="#6ea8fe" stroke-width="1.5"/>
  <text x="135" y="130.6" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">X: baseline covariates</text>
  <text x="135" y="145.4" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">(SOFA, age, ...)</text>
  <rect x="40" y="478" width="190" height="56" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="135" y="498.6" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">A: arm</text>
  <text x="135" y="513.4" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">(MP vs placebo)</text>
  <circle cx="457" cy="736" r="75" fill="#e9ecef" stroke="#6c757d" stroke-width="1.5"/>
  <text x="457" y="736" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">U: unmeasured frailty</text>
  <circle cx="503" cy="115" r="75" fill="#e9ecef" stroke="#6c757d" stroke-width="1.5"/>
  <text x="503" y="107.6" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">G = (S(0), S(1))</text>
  <text x="503" y="122.4" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">all four strata possible</text>
  <rect x="684" y="570" width="190" height="56" fill="#d1e7dd" stroke="#198754" stroke-width="1.5"/>
  <text x="779" y="590.6" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">S: alive at Day 90</text>
  <text x="779" y="605.4" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">(observed)</text>
  <ellipse cx="779" cy="253" rx="115" ry="38" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="779" y="245.6" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">Y(a): QoL at Day 90</text>
  <text x="779" y="260.4" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">(defined only if alive)</text>
  <polygon points="1101,382 1231,437 1101,492 971,437" fill="#fde2c4" stroke="#fd7e14" stroke-width="1.5"/>
  <text x="1101" y="429.6" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">SACE ∈ [L_X, U_X]</text>
  <text x="1101" y="444.4" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">(narrower than A5)</text>
