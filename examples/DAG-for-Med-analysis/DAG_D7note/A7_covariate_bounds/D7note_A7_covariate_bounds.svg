<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1271" height="1273" viewBox="0 0 1271 1273" overflow="visible">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#444444"/></marker>
    <marker id="arrowhead-ov" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc3545"/></marker>
  </defs>
  <!-- edges -->
  <line x1="230" y1="132.1" x2="426.1" y2="119.8" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <text x="308.5" y="116.7" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#444444" font-family="Helvetica,Arial,sans-serif">X strongly predicts G</text>
  <text x="308.5" y="129.7" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#444444" font-family="Helvetica,Arial,sans-serif">(e.g. baseline SOFA)</text>
  <line x1="230" y1="155" x2="675.9" y2="234.6" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <line x1="225.5" y1="166" x2="1024" y2="413.2" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <text x="544.9" y="254.4" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#444444" font-family="Helvetica,Arial,sans-serif">bounds computed within X,</text>
  <text x="544.9" y="267.4" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#444444" font-family="Helvetica,Arial,sans-serif">then combined</text>
  <line x1="230" y1="519.6" x2="682" y2="584.1" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <line x1="206.3" y1="478" x2="703.1" y2="282.8" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <line x1="462.5" y1="661.2" x2="497.3" y2="191.8" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <line x1="498.6" y1="673.6" x2="753.2" y2="291.8" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <line x1="540.2" y1="180.1" x2="762" y2="568.3" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <line x1="570.1" y1="148.5" x2="713.8" y2="220.4" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <line x1="836.6" y1="285.9" x2="1044" y2="404.4" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
