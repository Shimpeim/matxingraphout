  <rect x="32" y="1144" width="20" height="14" fill="#f8d7da" stroke="#4a5568" stroke-width="1" rx="2"/>
  <text x="64" y="1155" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Potential (counterfactual) quantity</text>
  <rect x="32" y="1168" width="20" height="14" fill="#fde2c4" stroke="#4a5568" stroke-width="1" rx="2"/>
  <text x="64" y="1179" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Quantity analysed / target</text>
  <text x="24" y="1200" font-size="9" font-weight="bold" fill="#718096" font-family="Helvetica,Arial,sans-serif" text-transform="uppercase">EDGE TYPES</text>
