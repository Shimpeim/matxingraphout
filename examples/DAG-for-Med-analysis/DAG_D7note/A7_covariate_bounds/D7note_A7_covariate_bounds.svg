  <rect x="12" y="861" width="230" height="412" fill="white" stroke="#cbd5e0" stroke-width="1" rx="4"/>
  <text x="24" y="878" font-size="11" font-weight="bold" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">A7 — Covariate-refined bounds (Long &amp; Hudgens-type)</text>
  <line x1="16" y1="883" x2="238" y2="883" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="900" font-size="9" font-weight="bold" fill="#718096" font-family="Helvetica,Arial,sans-serif" text-transform="uppercase">SHAPES</text>
