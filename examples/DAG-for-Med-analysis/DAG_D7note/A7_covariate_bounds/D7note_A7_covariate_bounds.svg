  <text x="64" y="1017" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Analysed quantity / target</text>
  <text x="24" y="1038" font-size="9" font-weight="bold" fill="#718096" font-family="Helvetica,Arial,sans-serif" text-transform="uppercase">NODE COLOURS</text>
  <rect x="32" y="1048" width="20" height="14" fill="#cfe2ff" stroke="#4a5568" stroke-width="1" rx="2"/>
  <text x="64" y="1059" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Baseline covariates (recorded)</text>
  <rect x="32" y="1072" width="20" height="14" fill="#fff3cd" stroke="#4a5568" stroke-width="1" rx="2"/>
  <text x="64" y="1083" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Randomised treatment</text>
