  <rect x="32" y="967" width="20" height="14" fill="#cfe2ff" stroke="#4a5568" stroke-width="1" rx="2"/>
  <text x="64" y="978" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Baseline covariates (recorded)</text>
