  <text x="135" y="142.4" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">(SOFA, age, ...)</text>
  <rect x="40" y="427" width="190" height="56" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
