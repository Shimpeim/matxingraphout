  <circle cx="455" cy="115" r="75" fill="#e9ecef" stroke="#6c757d" stroke-width="1.5"/>
  <text x="455" y="100.2" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">G = (S(0), S(1))</text>
