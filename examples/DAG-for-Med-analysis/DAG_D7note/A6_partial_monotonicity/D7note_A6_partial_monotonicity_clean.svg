  <text x="695" y="527.6" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">S: alive at Day 90</text>
  <text x="695" y="542.4" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">(observed)</text>
  <ellipse cx="695" cy="235" rx="115" ry="38" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
