<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1416" height="1039" viewBox="0 0 1416 1039" overflow="visible">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#444444"/></marker>
    <marker id="arrowhead-ov" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc3545"/></marker>
  </defs>
  <!-- edges -->
  <line x1="174.2" y1="96" x2="834.8" y2="567.8" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <line x1="230" y1="85" x2="772.5" y2="181.8" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <line x1="230" y1="504.8" x2="778.6" y2="583.1" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <text x="449.4" y="532.1" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#444444" font-family="Helvetica,Arial,sans-serif">MP may change survival</text>
  <line x1="206.3" y1="463.2" x2="799.7" y2="230.1" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <text x="443.6" y="365.9" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#444444" font-family="Helvetica,Arial,sans-serif">effect of interest</text>
  <line x1="931.6" y1="569" x2="1184.5" y2="442.5" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <text x="1032.8" y="514.4" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#444444" font-family="Helvetica,Arial,sans-serif">restrict to S = 1</text>
  <line x1="933.2" y1="233.1" x2="1188.9" y2="379.3" marker-end="url(#arrowhead)" stroke="#444444" stroke-width="1.6" fill="none"/>
  <!-- overlay edges -->
  <line x1="225.5" y1="96" x2="1168.9" y2="388" marker-end="url(#arrowhead-ov)" stroke="#dc3545" stroke-width="1.2" fill="none" stroke-dasharray="6,3"/>
  <text x="602.8" y="182.8" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#dc3545" font-family="Helvetica,Arial,sans-serif">a causal contrast in one population only if</text>
  <text x="602.8" y="195.8" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#dc3545" font-family="Helvetica,Arial,sans-serif">S and Y share no causes other than A</text>
  <text x="602.8" y="208.8" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#dc3545" font-family="Helvetica,Arial,sans-serif">(X adjusted for, no U) AND A does not</text>
  <text x="602.8" y="221.8" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#dc3545" font-family="Helvetica,Arial,sans-serif">change who survives — otherwise the two</text>
  <text x="602.8" y="234.8" text-anchor="middle" dominant-baseline="auto" font-size="10" fill="#dc3545" font-family="Helvetica,Arial,sans-serif">survivor groups differ (§1.1)</text>
  <!-- nodes -->
  <rect x="40" y="40" width="190" height="56" rx="12.3" fill="#cfe2ff" stroke="#6ea8fe" stroke-width="1.5"/>
  <text x="135" y="60.6" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">X: baseline covariates</text>
  <text x="135" y="75.4" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">(SOFA, age, ...)</text>
  <rect x="40" y="463.2" width="190" height="56" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="135" y="483.8" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">A: arm</text>
  <text x="135" y="498.6" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">(MP vs placebo)</text>
  <rect x="780.6" y="569" width="190" height="56" fill="#d1e7dd" stroke="#198754" stroke-width="1.5"/>
  <text x="875.6" y="589.6" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">S: alive at Day 90</text>
  <text x="875.6" y="604.4" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">(observed)</text>
  <ellipse cx="875.6" cy="200.2" rx="115" ry="38" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="875.6" y="192.8" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">Y(a): QoL at Day 90</text>
  <text x="875.6" y="207.7" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">(defined only if alive)</text>
  <polygon points="1245.9,356.8 1375.9,411.8 1245.9,466.8 1115.9,411.8" fill="#fde2c4" stroke="#fd7e14" stroke-width="1.5"/>
  <text x="1245.9" y="404.4" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">E[Y|A=1,S=1] − E[Y|A=0,S=1]</text>
  <text x="1245.9" y="419.3" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#222222" font-family="Helvetica,Arial,sans-serif">(survivors only)</text>
  <!-- legend -->
  <rect x="12" y="675" width="230" height="364" fill="white" stroke="#cbd5e0" stroke-width="1" rx="4"/>
  <text x="24" y="692" font-size="11" font-weight="bold" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">A1 — Complete-case (survivor-completer) contrast</text>
  <line x1="16" y1="697" x2="238" y2="697" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="714" font-size="9" font-weight="bold" fill="#718096" font-family="Helvetica,Arial,sans-serif" text-transform="uppercase">SHAPES</text>
  <rect x="30" y="724" width="24" height="14" rx="4" fill="#e8f0fe" stroke="#4a5568" stroke-width="1"/>
  <text x="64" y="735" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Baseline</text>
  <rect x="30" y="748" width="24" height="14" fill="#e8f0fe" stroke="#4a5568" stroke-width="1"/>
  <text x="64" y="759" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Treatment / recorded</text>
  <ellipse cx="42" cy="779" rx="12" ry="7" fill="#e8f0fe" stroke="#4a5568" stroke-width="1"/>
  <text x="64" y="783" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Potential outcome</text>
  <polygon points="42,795 54,803 42,811 30,803" fill="#e8f0fe" stroke="#4a5568" stroke-width="1"/>
  <text x="64" y="807" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Analysed quantity / target</text>
  <text x="24" y="828" font-size="9" font-weight="bold" fill="#718096" font-family="Helvetica,Arial,sans-serif" text-transform="uppercase">NODE COLOURS</text>
  <rect x="32" y="838" width="20" height="14" fill="#cfe2ff" stroke="#4a5568" stroke-width="1" rx="2"/>
  <text x="64" y="849" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Baseline covariates (recorded)</text>
  <rect x="32" y="862" width="20" height="14" fill="#fff3cd" stroke="#4a5568" stroke-width="1" rx="2"/>
  <text x="64" y="873" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Randomised treatment</text>
  <rect x="32" y="886" width="20" height="14" fill="#d1e7dd" stroke="#4a5568" stroke-width="1" rx="2"/>
  <text x="64" y="897" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Recorded variable</text>
  <rect x="32" y="910" width="20" height="14" fill="#f8d7da" stroke="#4a5568" stroke-width="1" rx="2"/>
  <text x="64" y="921" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Potential (counterfactual) quantity</text>
  <rect x="32" y="934" width="20" height="14" fill="#fde2c4" stroke="#4a5568" stroke-width="1" rx="2"/>
  <text x="64" y="945" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">Quantity analysed / target</text>
  <text x="24" y="966" font-size="9" font-weight="bold" fill="#718096" font-family="Helvetica,Arial,sans-serif" text-transform="uppercase">EDGE TYPES</text>
  <line x1="28" y1="983" x2="56" y2="983" stroke="#444444" stroke-width="1.6" fill="none"/>
  <polygon points="56,983 51,980 51,986" fill="#444444"/>
  <text x="64" y="987" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">causal (assumed model)</text>
  <line x1="28" y1="1007" x2="56" y2="1007" stroke="#dc3545" stroke-width="1.2" fill="none" stroke-dasharray="6,3"/>
  <polygon points="56,1007 51,1004 51,1010" fill="#dc3545"/>
  <text x="64" y="1011" font-size="10" fill="#2d3748" font-family="Helvetica,Arial,sans-serif">annotation: assumption / target</text>
</svg>
